# Optional "Blueprint": Render dashboard -> New -> Blueprint -> pick this repo.
# (You can also create the service by hand — see RENDER_GUIDE.md.)
services:
  - type: web
    name: vap-learners-backend
    runtime: docker
    plan: free
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_CRED_JSON
        sync: false
      - key: MAX_CONCURRENT_VIDEO_JOBS
        value: "1"
